<div class="card card-windows">
  <div class="card-header card-header-windows d-flex justify-content-center">
    Búsqueda
  </div>
  <div class="card-body">
    <div class="content-seacher">
      <form class="search-container">
        <img
          class="logo search-icon"
          src="assets/icon/navbar_search_top_bar.svg"
          alt="administrador"
        />
        <input
          class="form-control search-windows"
          type="search"
          aria-label="Search"
        />
      </form>
    </div>
    <div class="content-select mt-2 content-seacher">
      <div class="search-container-option">
        <!-- <img class="logo search-icon" src="assets/icon/circle.svg" alt="administrador"> -->
        <div class="select-option" (click)="clickSearcher()">
          Criterio de Búsqueda
        </div>
        <!-- <img class="logo search-icon" src="assets/icon/circle.svg" alt="circle"> -->
      </div>
    </div>
    <div class="form-select-option" *ngIf="isVisible">
      <div class="search-container-option" *ngFor="let option of optionSearch">
        <!-- <img class="logo search-icon" src="assets/icon/circle.svg" alt="administrador"> -->
        <p class="option">{{ option }}</p>
      </div>
    </div>
    <div class="d-flex justify-content-around mt-2 mb-2">
      <button class="btn btn-card-windows">Buscar</button>
      <button class="btn btn-card-windows">Limpiar</button>
    </div>
  </div>
</div>
