<div class="mapa-toolbar d-flex flex-column align-items-center">
  <ul>
    <li>
      <img
        src="assets/icon/toolbar_vertical_compass.svg"
        class="icon-tool"
        alt="compass"
        (click)="locateUserClick()"
        (keydown)="locateUserClick()"
      />
    </li>
    <li>
      <img
        src="assets/icon/toolbar_vertical_locate.svg"
        class="icon-tool"
        alt="locate"
        (click)="onMarkPointClick()"
        (keydown)="onMarkPointClick()"
      />
    </li>
    <li>
      <img
        src="assets/icon/toolbar_vertical_home.svg"
        class="icon-tool"
        alt="home"
        (click)="resetMap()"
        (keydown)="resetMap()"
      />
    </li>
    <li>
      <img
        class="icon-tool"
        src="assets/icon/toolbar_vertical_maximize.svg"
        alt="maximize"
        (click)="zoomInClick()"
        (keydown)="zoomInClick()"
      />
    </li>
    <li class="slidecontainer">
      <input
        type="range"
        min="3"
        max="18"
        class="range"
        [ngModel]="zoomLevel"
        (input)="onRangeChange($event)"
      />
    </li>
    <li>
      <img
        class="icon-tool"
        src="assets/icon/toolbar_vertical_minimize.svg"
        alt="minimize"
        (click)="zoomOutClick()"
        (keydown)="zoomOutClick()"
      />
    </li>
  </ul>
</div>
