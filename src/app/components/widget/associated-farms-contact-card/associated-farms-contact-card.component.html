<app-movable-card [initialX]="550" [initialY]="150">
    <div class="card-title">
        <div class="d-flex align-items-center justify-content-center">
            <b>Fincas asociadas</b>
        </div>
    </div>

    <div *ngFor="let data of data">
        <div class="row justify-content-center text-center">
            <div class="row">
                <div><b>Número de Finca / Folio N.</b></div>
                <div>{{ data.FincaFolio }}</div>
            </div>

            <div class="row">
                <div><b>Dirección</b></div>
                <div>{{ data.FincaDireccion }}</div>
            </div>
            <hr>
        </div>
    </div>
</app-movable-card>
