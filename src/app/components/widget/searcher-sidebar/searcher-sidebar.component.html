<div class="card card-windows">
  <div class="card-header card-header-windows d-flex justify-content-center">
    Búsqueda
  </div>
  <div class="card-body">
    <div class="content-seacher">
      <form [formGroup]="formSearch" class="search-container"  (ngSubmit)="searchInformation()" id="formSearchId">
        <img
          class="search-icon"
          src="assets/icon/navbar_search_top_bar.svg"
          alt="administrador"
        />
        <input
          class="form-control search-windows"
          type="search"
          aria-label="Search"
          formControlName="inputSearch"
          [placeholder]="placeholderText"
        />
      </form>
    </div>
    <div class="content-select mt-2 content-seacher">
      <div class="search-container-option">
        <div class="select-option" (click)="clickSearcher()" (keydown)="clickSearcher()">
          <img class="logo search-icon" src="assets/icon/circle_light.svg" alt="circle">
          {{ selectedOption }}
          <img class="search-icon" [src]="'assets/icon/' + displayIcon" alt="icono desplegar">
        </div>
      </div>
    </div>
    <div class="form-select-option" *ngIf="isVisible">
      <div class="search-container-option" *ngFor="let option of optionSearch" (click)="selectOption(option.label)" (keydown)="selectOption(option.label)">
        <p class="option option-hover">
          <img class="logo search-icon" src="assets/icon/circle_light.svg" alt="administrador">
          {{ option.label }}
        </p>
      </div>
    </div>
    <div class="d-flex justify-content-around mt-2 mb-4">
      <button class="btn btn-card btn-card-windows" type="submit" form="formSearchId">Buscar</button>
      <button class="btn btn-card btn-card-windows" (click)="clearInformation()">Limpiar</button>
    </div>
    <div class="option-info-user mb-4" *ngIf="infoSeacher$ | async as infoSeacher">
      <div class="search-container-option" 
      *ngFor="let info of infoSeacher; trackBy: trackByAcreditado">
        <p class="option option-tc d-flex justify-content-between">
          No. Cliente: {{ info.AcreditadoNum }} -
          <small *ngIf="info.TipoDireccionCod == '1'">DR</small>
          <small *ngIf="info.TipoDireccionCod == '2'">DL</small>
          <small *ngIf="info.TipoDireccionCod == '3'">DL</small>
          <button class="btn btn-card btn-card-tc" (click)="showCardUser(info.Direccion_Id)">Ver TC</button>
        </p>
      </div>
    </div>
  </div>
</div>
